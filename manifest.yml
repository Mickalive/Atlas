manifestVersion: 1

# Pre-registration placeholder. The live gate detects this exact sentinel and
# runs `forge register`, which replaces it with the real app ARI.
app:
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs24.x
    memoryMB: 512
  licensing:
    enabled: true

modules:
  jira:adminPage:
    - key: atlas-dashboard-page
      resource: atlas-dashboard-ui
      render: native
      resolver:
        function: atlas-resolver-fn
      title: Atlas - Cut My Atlassian Bill

  function:
    - key: atlas-resolver-fn
      handler: index.handler
    - key: atlas-scan-chunk-fn
      handler: index.scanChunkHandler
      # Scheduled triggers default to a much shorter timeout. Atlas chunks are
      # deliberately allowed to run up to the current Forge maximum.
      timeoutSeconds: 900

  scheduledTrigger:
    - key: atlas-scan-resume
      function: atlas-scan-chunk-fn
      interval: fiveMinute

resources:
  - key: atlas-dashboard-ui
    path: src/frontend/dashboard.jsx

permissions:
  scopes:
    # --- verified read budget (docs/API_FEASIBILITY.md section 8) ---
    - read:license:jira
    - read:application-role:jira
    - read:user:jira
    - read:group:jira
    - read:avatar:jira
    # Issue-derived activity evidence; deviation recorded and VERIFY-LIVE:
    # docs/API_FEASIBILITY_ADDENDUM.md
    - read:jira-work
    - read:content-details:confluence
    - read:user:confluence
    - read:group:confluence
  # No write scopes. No admin scopes. No egress remotes in V1:
  # org-admin enrichment ships disabled and api.atlassian.com stays undeclared.
