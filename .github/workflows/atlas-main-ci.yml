name: Atlas Main Deterministic Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'manifest.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'state/**'
      - 'docs/agents/**'
      - 'docs/FORGE_PARITY_MODE.md'
      - '.opencode/agents/**'
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: atlas-main-deterministic-audit
  cancel-in-progress: true

jobs:
  control_plane:
    name: CONTROL PLANE STATIC AUDIT
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate control-plane invariants
        run: bash .github/scripts/control-plane-check.sh

  host_product_gates:
    name: HOST PRODUCT GATES
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Static gates
        run: npm run lint
      - name: Build gate
        run: npm run build

  forge_parity:
    name: FORGE PARITY GATE
    needs: [control_plane, host_product_gates]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Run isolated Node 24 / 512MB Forge parity gate
        run: bash .github/scripts/forge-parity-check.sh
