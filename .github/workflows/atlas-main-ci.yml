name: Atlas Deterministic CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'manifest.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.frontend.json'
      - 'state/**'
      - 'docs/**'
      - '.opencode/agents/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'ATLAS_MASTER_PROMPT.md'
      - 'AGENTS.md'
      - 'PRODUCT_CONTRACT.md'
      - 'forge-local/**'

permissions:
  contents: read

concurrency:
  group: atlas-deterministic-ci
  cancel-in-progress: true

jobs:
  deterministic:
    name: DETERMINISTIC PRODUCT GATES
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate simple control plane
        run: bash .github/scripts/control-plane-check.sh
      - name: Install dependencies
        run: npm ci
      - name: Product tests
        run: npm test
      - name: Backend and UI Kit typecheck
        run: npm run typecheck
      - name: Static product and Marketplace gates
        run: npm run lint
      - name: High and critical dependency advisory gate
        run: npm run audit:high
      - name: Build gate
        run: npm run build
      - name: Isolated Forge parity gate
        run: bash .github/scripts/forge-parity-check.sh

  authenticated_forge_lint:
    name: AUTHENTICATED FORGE LINT WHEN AVAILABLE
    needs: [deterministic]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Lint registered app when credentials exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FORGE_EMAIL" || -z "$FORGE_API_TOKEN" ]]; then
            echo 'FORGE_AUTHENTICATED_LINT=SKIPPED_MISSING_CREDENTIALS'
            exit 0
          fi
          if ! grep -Eq '^[[:space:]]+id:[[:space:]]*ari:cloud:ecosystem::app/' manifest.yml || grep -Eq 'ari:cloud:ecosystem::app/0{8}-0{4}-0{4}-0{4}-0{12}|ATLAS_PLACEHOLDER' manifest.yml; then
            echo 'FORGE_AUTHENTICATED_LINT=SKIPPED_UNREGISTERED_APP'
            exit 0
          fi
          npm install -g @forge/cli@latest
          forge settings set usage-analytics false || true
          forge whoami
          forge lint
          echo 'FORGE_AUTHENTICATED_LINT=PASS'
