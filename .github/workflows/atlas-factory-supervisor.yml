name: Atlas Factory Continuity Supervisor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/atlas-factory-supervisor.yml'
      - '.github/scripts/atlas-housekeeping.sh'
  workflow_run:
    workflows: ["Atlas 24h Product Factory"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas-factory-orchestrator
  cancel-in-progress: false

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prune stale Atlas workflows, runs and factory branches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_KEEP_RUNS_PER_WORKFLOW: '8'
          ATLAS_KEEP_FACTORY_BRANCH_SETS: '2'
        run: bash .github/scripts/atlas-housekeeping.sh

  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guarantee a next Atlas cycle until Marketplace ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          WF='atlas-factory.yml'

          active_factory_count() {
            gh run list --repo "$REPO" --workflow "$WF" --limit 30 --json status \
              --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0
          }

          dispatch_if_idle() {
            local active_now
            active_now=$(active_factory_count)
            if [[ "$active_now" -gt 0 ]]; then
              echo 'ATLAS_CONTINUITY=DISPATCH_SKIPPED_FACTORY_APPEARED'
              return 0
            fi
            gh workflow run "$WF" --repo "$REPO" --ref main
          }

          RUNS=$(gh run list --repo "$REPO" --workflow "$WF" --limit 50 --json databaseId,status,conclusion,createdAt,attempt 2>/dev/null || echo '[]')
          ACTIVE=$(jq '[.[] | select(.status != "completed")] | length' <<<"$RUNS" 2>/dev/null || echo 0)
          if [[ "$ACTIVE" -gt 0 ]]; then
            echo 'ATLAS_CONTINUITY=ACTIVE_FACTORY_PRESENT'
            exit 0
          fi

          # Marketplace readiness is the only autonomous stop state. Missing,
          # unreadable, malformed or prematurely stopped state means unfinished.
          META=$(gh api "repos/${REPO}/contents/state/factory_direction.json?ref=main" 2>/dev/null || echo '{}')
          STATE_SHA=$(jq -r '.sha // empty' <<<"$META" 2>/dev/null || true)
          ENCODED=$(jq -r '.content // empty' <<<"$META" 2>/dev/null | tr -d '\n' || true)
          STATE='{}'
          if [[ -n "$ENCODED" ]]; then
            STATE=$(printf '%s' "$ENCODED" | base64 -d 2>/dev/null || echo '{}')
          fi

          STATUS=$(jq -r '.release_status // "UNKNOWN"' <<<"$STATE" 2>/dev/null || echo UNKNOWN)
          CONTINUE=$(jq -r 'if (.continue|type)=="boolean" then .continue else false end' <<<"$STATE" 2>/dev/null || echo false)
          NEXT=$(jq -r '.next_focus // empty' <<<"$STATE" 2>/dev/null || true)

          if [[ "$STATUS" == 'MARKETPLACE_READY' ]]; then
            echo 'ATLAS_CONTINUITY=PRODUCT_FINISHED_MARKETPLACE_READY'
            exit 0
          fi

          # Self-heal the persisted contract so a candidate/live gate can never
          # permanently park unfinished work with continue=false. If state is
          # missing/corrupt, replace it with an honest BUILDING recovery state.
          if [[ "$STATUS" == 'UNKNOWN' || "$CONTINUE" != true || -z "$NEXT" ]]; then
            NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            if [[ "$STATUS" == 'UNKNOWN' ]]; then
              STATUS='BUILDING'
              NEXT='Recover accepted machine state, then continue the highest-value unfinished Marketplace-readiness work.'
              REASON='Factory state was missing or invalid; continuity supervisor normalized it because Atlas is not Marketplace ready.'
            else
              [[ -n "$NEXT" ]] || NEXT='Continue the highest-value unfinished Marketplace-readiness work and re-check all external blockers.'
              REASON=$(jq -r '.reason // "Unfinished Atlas work remains."' <<<"$STATE" 2>/dev/null || echo 'Unfinished Atlas work remains.')
            fi
            NEW_STATE=$(jq -n --arg status "$STATUS" --arg reason "$REASON" --arg next "$NEXT" --arg now "$NOW" '{release_status:$status,continue:true,reason:$reason,next_focus:$next,updated_at:$now}')
            NEW_B64=$(printf '%s\n' "$NEW_STATE" | base64 -w0)
            if [[ -n "$STATE_SHA" ]]; then
              gh api --method PUT "repos/${REPO}/contents/state/factory_direction.json" \
                -f message='Normalize unfinished Atlas continuation state' \
                -f content="$NEW_B64" -f sha="$STATE_SHA" -f branch='main' >/dev/null
            else
              gh api --method PUT "repos/${REPO}/contents/state/factory_direction.json" \
                -f message='Restore Atlas continuation state' \
                -f content="$NEW_B64" -f branch='main' >/dev/null
            fi
            CONTINUE=true
            echo "ATLAS_CONTINUITY=STATE_SELF_HEALED status=$STATUS"
          fi

          LATEST=$(jq '[.[] | select(.status=="completed")] | sort_by(.createdAt) | last // {}' <<<"$RUNS" 2>/dev/null || echo '{}')
          ID=$(jq -r '.databaseId // empty' <<<"$LATEST")
          CONCLUSION=$(jq -r '.conclusion // empty' <<<"$LATEST")
          CREATED=$(jq -r '.createdAt // empty' <<<"$LATEST")
          ATTEMPT=$(jq -r '.attempt // 1' <<<"$LATEST")

          if [[ -z "$ID" ]]; then
            echo "ATLAS_CONTINUITY=BOOTSTRAP status=$STATUS"
            dispatch_if_idle
            exit 0
          fi

          # Give the five-minute watchdog one recovery window for a newly
          # failed run. If it still has not recovered by the next supervisor
          # tick, start a fresh cycle from main. This prevents permanent death
          # after provider, runner, deterministic, timeout or cancelled runs.
          if [[ "$CONCLUSION" != success && -n "$CREATED" ]]; then
            now=$(date -u +%s)
            then=$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)
            age=$(( now - then ))
            if [[ "$age" -lt 420 && "$ATTEMPT" -lt 3 ]]; then
              echo "ATLAS_CONTINUITY=WATCHDOG_RECOVERY_WINDOW run=$ID conclusion=$CONCLUSION age=${age}s"
              exit 0
            fi
          fi

          echo "ATLAS_CONTINUITY=DISPATCH_FRESH_CYCLE status=$STATUS prior_run=$ID prior_conclusion=${CONCLUSION:-unknown} next_focus=$NEXT"
          dispatch_if_idle
