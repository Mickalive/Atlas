name: Atlas Product Factory

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas-product-factory
  cancel-in-progress: false

env:
  ATLAS_MODEL: opencode/x-preview-f-free
  ATLAS_NODE_VERSION: '24'

jobs:
  advance:
    name: ADVANCE ATLAS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ATLAS_NODE_VERSION }}
          cache: npm

      - name: Validate simple control plane
        run: bash .github/scripts/control-plane-check.sh

      - name: Remove obsolete Atlas automation history
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/atlas-housekeeping.sh

      - name: Detect live Forge credentials without exposing them to builders
        id: credentials
        shell: bash
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
          FORGE_DEVELOPER_SPACE_ID: ${{ secrets.FORGE_DEVELOPER_SPACE_ID }}
        run: |
          set -euo pipefail
          forge_ready=false
          register_ready=false
          if [[ -n "$FORGE_EMAIL" && -n "$FORGE_API_TOKEN" && -n "$ATLASSIAN_SITE" ]]; then
            forge_ready=true
          fi
          if [[ "$forge_ready" == true && -n "$FORGE_DEVELOPER_SPACE_ID" ]]; then
            register_ready=true
          fi
          echo "forge_ready=$forge_ready" >> "$GITHUB_OUTPUT"
          echo "register_ready=$register_ready" >> "$GITHUB_OUTPUT"

      - name: Decide the only next mode
        id: mode
        shell: bash
        env:
          FORGE_READY: ${{ steps.credentials.outputs.forge_ready }}
        run: |
          set -euo pipefail
          status=$(jq -r '.release_status' state/factory_direction.json)
          next_focus=$(jq -r '.next_focus // empty' state/factory_direction.json)
          echo "status=$status" >> "$GITHUB_OUTPUT"

          case "$status" in
            MARKETPLACE_READY)
              mode=stop
              ;;
            PARITY_READY_AWAITING_CREDENTIALS)
              if [[ "$FORGE_READY" == true ]]; then mode=live; else mode=wait; fi
              ;;
            BUILDING|LIVE_DEV_VERIFIED|BLOCKED_HUMAN)
              mode=build
              ;;
            *)
              echo "::error::Unknown Atlas release_status: $status"
              exit 64
              ;;
          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ATLAS_MODE=$mode status=$status next_focus=$next_focus"

      - name: Stop cleanly when Marketplace-ready
        if: steps.mode.outputs.mode == 'stop'
        run: echo 'ATLAS_FACTORY=STOP_MARKETPLACE_READY'

      - name: Wait cleanly for live credentials
        if: steps.mode.outputs.mode == 'wait'
        run: echo 'ATLAS_FACTORY=WAITING_FORGE_CREDENTIALS_NO_OX_CALL'

      - name: Install OpenCode only when product work exists
        if: steps.mode.outputs.mode == 'build'
        run: bash .github/scripts/install-opencode-with-retry.sh

      - name: Advance the product in one bounded autonomous pass
        if: steps.mode.outputs.mode == 'build'
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent release_integrator \
            "Advance the existing Atlas product, not the automation. Read ATLAS_MASTER_PROMPT.md, PRODUCT_CONTRACT.md, AGENTS.md, your canonical card, docs/RELEASE_STATUS.md and state/factory_direction.json. Implement the concrete next_focus or the highest-value remaining release blocker. Preserve the current product, its read-only V1 scope, its evidence/risk semantics and all existing tests. Verify current official Atlassian/Forge documentation when a platform fact matters. Do not create new agents, workflows, branches, handoff layers or speculative features. Do not stop at analysis: edit the product, add or repair tests where needed, run the real gates, update docs/RELEASE_STATUS.md and state/factory_direction.json honestly."

      - name: Install product dependencies for hard gates
        if: steps.mode.outputs.mode == 'build' || steps.mode.outputs.mode == 'live'
        run: npm ci

      - name: Hard deterministic product gates
        if: steps.mode.outputs.mode == 'build' || steps.mode.outputs.mode == 'live'
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          npm run lint
          npm run audit:high
          npm run build
          bash .github/scripts/forge-parity-check.sh

      - name: Commit only gate-clean autonomous product changes
        if: steps.mode.outputs.mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name atlas-product-factory
          git config user.email atlas-product-factory@autonomous.local
          git add -A
          if git diff --cached --quiet; then
            echo 'ATLAS_PRODUCT_COMMIT=NO_CHANGES'
            exit 0
          fi
          git commit -m "Advance Atlas product ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'ATLAS_PRODUCT_COMMIT=PASS'

      - name: Authenticated Forge register, lint, deploy and install
        if: steps.mode.outputs.mode == 'live'
        shell: bash
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_DEVELOPER_SPACE_ID: ${{ secrets.FORGE_DEVELOPER_SPACE_ID }}
          ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
        run: |
          set -euo pipefail
          npm install -g @forge/cli@latest
          forge settings set usage-analytics false || true
          forge whoami

          if ! grep -Eq '^[[:space:]]+id:[[:space:]]*ari:cloud:ecosystem::app/' manifest.yml || grep -Eq 'ari:cloud:ecosystem::app/0{8}-0{4}-0{4}-0{4}-0{12}|ATLAS_PLACEHOLDER' manifest.yml; then
            if [[ -z "$FORGE_DEVELOPER_SPACE_ID" ]]; then
              echo '::error::FORGE_DEVELOPER_SPACE_ID is required to register the unregistered app.'
              exit 65
            fi
            forge register --developer-space-id "$FORGE_DEVELOPER_SPACE_ID" --accept-terms 'Cut My Atlassian Bill'

            git config user.name atlas-forge-release
            git config user.email atlas-forge-release@autonomous.local
            git add manifest.yml
            git commit -m "Register Atlas Forge app"
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'ATLAS_FORGE_REGISTRATION=PERSISTED'
          fi

          forge lint
          forge deploy -e development --non-interactive
          forge install --site "$ATLASSIAN_SITE" --product Jira -e development --upgrade all --confirm-scopes --non-interactive

          now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          tmp=$(mktemp)
          jq --arg now "$now" '
            .release_status="LIVE_DEV_VERIFIED"
            | .continue=true
            | .reason="Authenticated Forge lint, development deploy and Jira install completed successfully. Real-environment verification and Marketplace packaging remain."
            | .next_focus="Complete the real-environment verification checklist and Marketplace/security/privacy packaging without widening V1 scope."
            | .updated_at=$now
          ' state/factory_direction.json > "$tmp"
          mv "$tmp" state/factory_direction.json

          git config user.name atlas-forge-release
          git config user.email atlas-forge-release@autonomous.local
          git add state/factory_direction.json
          git commit -m "Record Atlas live Forge verification"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'ATLAS_FORGE_LIVE_GATE=PASS'
