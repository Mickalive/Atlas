name: Atlas 24h Product Factory

on:
  workflow_dispatch:
  push:
    paths:
      - '.factory/KICKOFF'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: atlas-product-factory
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  ATLAS_MODEL: opencode/x-preview-f-free
  ATLAS_NODE_VERSION: '24'

jobs:
  api_architect:
    name: API ARCHITECT
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare API lane
        run: git switch -C "factory/${GITHUB_RUN_ID}/api"
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Research API feasibility
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent api_architect \
            "Produce the binding API feasibility map for the current Atlas V1. Verify current official Atlassian docs on the network; do not rely on stale memory. Respect docs/FORGE_PARITY_MODE.md and the canonical Atlas control plane."
      - name: Persist API lane
        run: |
          git config user.name atlas-api-architect
          git config user.email atlas-api-architect@autonomous.local
          git add -A
          git commit -m "API feasibility ${GITHUB_RUN_ID}" || true
          git push --force origin "HEAD:factory/${GITHUB_RUN_ID}/api"

  product_architect:
    name: MARKET / PRODUCT ARCHITECT
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare Product lane
        run: git switch -C "factory/${GITHUB_RUN_ID}/product"
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Freeze sellable V1
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent market_product_architect \
            "Research the current Atlassian Marketplace and freeze the narrowest sellable V1. Recoup and current license optimizers are real competitors. Fixture/demo mode must be visibly non-live and cannot alter actual product logic."
      - name: Persist Product lane
        run: |
          git config user.name atlas-product-architect
          git config user.email atlas-product-architect@autonomous.local
          git add -A
          git commit -m "Product V1 ${GITHUB_RUN_ID}" || true
          git push --force origin "HEAD:factory/${GITHUB_RUN_ID}/product"

  security_architect:
    name: SECURITY / TEST ARCHITECT
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare Security lane
        run: git switch -C "factory/${GITHUB_RUN_ID}/security"
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Design safety gates
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent security_test_architect \
            "Define the least-privilege security model and false-positive test matrix for a real Marketplace release. Treat fixture/live separation, tenant isolation, partial scans and Forge parity constraints as release-critical."
      - name: Persist Security lane
        run: |
          git config user.name atlas-security-architect
          git config user.email atlas-security-architect@autonomous.local
          git add -A
          git commit -m "Security test plan ${GITHUB_RUN_ID}" || true
          git push --force origin "HEAD:factory/${GITHUB_RUN_ID}/security"

  builder:
    name: IMPLEMENTATION BUILDER
    needs: [api_architect, product_architect, security_architect]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ATLAS_NODE_VERSION }}
      - name: Mount and internalize architecture handoffs
        shell: bash
        run: |
          mkdir -p .factory-inputs
          for lane in api product security; do
            git fetch origin "factory/${GITHUB_RUN_ID}/$lane:refs/remotes/origin/factory/${GITHUB_RUN_ID}/$lane"
            git worktree add --detach "/tmp/atlas_$lane" "origin/factory/${GITHUB_RUN_ID}/$lane"
          done
          cp /tmp/atlas_api/docs/API_FEASIBILITY.md .factory-inputs/API_FEASIBILITY.md
          cp /tmp/atlas_product/docs/PRODUCT_V1.md .factory-inputs/PRODUCT_V1.md
          cp /tmp/atlas_security/docs/SECURITY_TEST_PLAN.md .factory-inputs/SECURITY_TEST_PLAN.md
          git switch -C "factory/${GITHUB_RUN_ID}/build"
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Build real Forge V1
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent implementation_builder \
            "Build the actual Atlas V1 now. Read .factory-inputs/API_FEASIBILITY.md, .factory-inputs/PRODUCT_V1.md and .factory-inputs/SECURITY_TEST_PLAN.md. Resolve contradictions conservatively. Verified API feasibility controls platform facts; stricter security controls safety; product spec controls UX only where technically and safely feasible. Build Forge-compatible production code plus a swappable fixture gateway. Do not stop at a plan."
      - name: Require actual product artifacts
        shell: bash
        run: |
          if [[ ! -f manifest.yml || ! -f package.json ]]; then
            echo '::error::ATLAS_BUILD_ARTIFACT_MISSING Builder returned without manifest.yml and package.json.'
            exit 70
          fi
      - name: Run host diagnostics
        continue-on-error: true
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm test --if-present
          npm run typecheck --if-present
          npm run lint --if-present
          npm run build --if-present
      - name: Run Forge parity diagnostic
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/forge-parity-check.sh
      - name: Persist build snapshot
        if: always()
        shell: bash
        run: |
          git config user.name atlas-builder
          git config user.email atlas-builder@autonomous.local
          git add -A
          git commit -m "Atlas V1 build ${GITHUB_RUN_ID}" || true
          git push --force origin "HEAD:factory/${GITHUB_RUN_ID}/build"

  functional_redteam:
    name: FUNCTIONAL RED TEAM
    needs: [builder]
    if: needs.builder.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout build snapshot
        shell: bash
        run: |
          git fetch origin "factory/${GITHUB_RUN_ID}/build:refs/remotes/origin/factory/${GITHUB_RUN_ID}/build"
          git switch -C "factory/${GITHUB_RUN_ID}/functional-audit" "origin/factory/${GITHUB_RUN_ID}/build"
          mkdir -p audit
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Attack correctness
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent functional_redteam \
            "Audit this exact builder snapshot. Attack fixture/live equivalence, false savings, partial scans, pricing math and all SAFE classifications. Your only durable output is audit/FUNCTIONAL.md. Do not repair the app."
      - name: Persist functional audit
        shell: bash
        run: |
          test -f audit/FUNCTIONAL.md || { echo '::error::Missing audit/FUNCTIONAL.md'; exit 1; }
          git reset -- . >/dev/null 2>&1 || true
          git add audit/FUNCTIONAL.md
          git config user.name atlas-functional-redteam
          git config user.email atlas-functional-redteam@autonomous.local
          git commit -m "Functional audit ${GITHUB_RUN_ID}" || true
          git push --force origin "HEAD:factory/${GITHUB_RUN_ID}/functional-audit"

  security_redteam:
    name: SECURITY RED TEAM
    needs: [builder, security_architect]
    if: needs.builder.result == 'success' && needs.security_architect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout build and internalize security handoff
        shell: bash
        run: |
          git fetch origin "factory/${GITHUB_RUN_ID}/build:refs/remotes/origin/factory/${GITHUB_RUN_ID}/build"
          git switch -C "factory/${GITHUB_RUN_ID}/security-audit" "origin/factory/${GITHUB_RUN_ID}/build"
          git fetch origin "factory/${GITHUB_RUN_ID}/security:refs/remotes/origin/factory/${GITHUB_RUN_ID}/security"
          git worktree add --detach /tmp/atlas_security_plan "origin/factory/${GITHUB_RUN_ID}/security"
          mkdir -p .factory-inputs audit
          cp /tmp/atlas_security_plan/docs/SECURITY_TEST_PLAN.md .factory-inputs/SECURITY_TEST_PLAN.md
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Attack security and Marketplace readiness
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent security_redteam \
            "Audit this exact builder snapshot. Read .factory-inputs/SECURITY_TEST_PLAN.md. Attack scope creep, tenant leakage, mock/live confusion, secret handling and unsafe remediation. Durable output only audit/SECURITY.md. Do not repair the app."
      - name: Persist security audit
        shell: bash
        run: |
          test -f audit/SECURITY.md || { echo '::error::Missing audit/SECURITY.md'; exit 1; }
          git reset -- . >/dev/null 2>&1 || true
          git add audit/SECURITY.md
          git config user.name atlas-security-redteam
          git config user.email atlas-security-redteam@autonomous.local
          git commit -m "Security audit ${GITHUB_RUN_ID}" || true
          git push --force origin "HEAD:factory/${GITHUB_RUN_ID}/security-audit"

  integrator:
    name: RELEASE INTEGRATOR
    needs: [functional_redteam, security_redteam]
    if: needs.functional_redteam.result == 'success' && needs.security_redteam.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ATLAS_NODE_VERSION }}
      - name: Checkout build and internalize audits
        shell: bash
        run: |
          git fetch origin "factory/${GITHUB_RUN_ID}/build:refs/remotes/origin/factory/${GITHUB_RUN_ID}/build"
          git switch -C "factory/${GITHUB_RUN_ID}/candidate" "origin/factory/${GITHUB_RUN_ID}/build"
          mkdir -p .factory-inputs/audits
          for lane in functional-audit security-audit; do
            git fetch origin "factory/${GITHUB_RUN_ID}/$lane:refs/remotes/origin/factory/${GITHUB_RUN_ID}/$lane"
            git worktree add --detach "/tmp/atlas_$lane" "origin/factory/${GITHUB_RUN_ID}/$lane"
          done
          cp /tmp/atlas_functional-audit/audit/FUNCTIONAL.md .factory-inputs/audits/FUNCTIONAL.md
          cp /tmp/atlas_security-audit/audit/SECURITY.md .factory-inputs/audits/SECURITY.md
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Repair and integrate
        shell: bash
        run: |
          .github/scripts/run-opencode-with-retry.sh run \
            --model "$ATLAS_MODEL" \
            --agent release_integrator \
            "Repair the build using .factory-inputs/audits/FUNCTIONAL.md and .factory-inputs/audits/SECURITY.md. Produce one release candidate, docs/RELEASE_STATUS.md and state/factory_direction.json. Do not stop until the parity gates pass or an explicit honest blocker remains."
      - name: Validate continuation contract
        shell: bash
        run: |
          test -f state/factory_direction.json || { echo '::error::Missing state/factory_direction.json'; exit 1; }
          jq -e '.release_status and (.continue|type=="boolean") and .reason and .next_focus and .updated_at' state/factory_direction.json >/dev/null
          jq -e '.release_status=="BUILDING" or .release_status=="PARITY_READY_AWAITING_CREDENTIALS" or .release_status=="LIVE_DEV_VERIFIED" or .release_status=="MARKETPLACE_READY" or .release_status=="BLOCKED_HUMAN"' state/factory_direction.json >/dev/null
          if [[ "$(jq -r '.continue' state/factory_direction.json)" == true ]]; then
            test -n "$(jq -r '.next_focus // empty' state/factory_direction.json)" || { echo '::error::continue=true requires next_focus'; exit 1; }
          fi
      - name: Remove ephemeral factory inputs
        run: rm -rf .factory-inputs
      - name: Hard host gate
        shell: bash
        run: |
          test -f manifest.yml || { echo '::error::Missing Forge manifest'; exit 1; }
          test -f package.json || { echo '::error::Missing package.json'; exit 1; }
          if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
          npm test --if-present
          npm run typecheck --if-present
          npm run lint --if-present
          npm run build --if-present
      - name: Hard Forge parity gate
        shell: bash
        run: bash .github/scripts/forge-parity-check.sh
      - name: Persist release candidate
        if: always()
        shell: bash
        run: |
          git config user.name atlas-release-integrator
          git config user.email atlas-release-integrator@autonomous.local
          git add -A
          git commit -m "Release candidate ${GITHUB_RUN_ID}" || true
          git push --force origin "HEAD:factory/${GITHUB_RUN_ID}/candidate"

  forge_release_gate:
    name: FORGE LIVE GATE + MAIN
    needs: [integrator]
    if: needs.integrator.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      FORGE_DEVELOPER_SPACE_ID: ${{ secrets.FORGE_DEVELOPER_SPACE_ID }}
      ATLASSIAN_SITE: ${{ secrets.ATLASSIAN_SITE }}
      ATLASSIAN_ORG_ID: ${{ secrets.ATLASSIAN_ORG_ID }}
      ATLASSIAN_ORG_API_KEY: ${{ secrets.ATLASSIAN_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ATLAS_NODE_VERSION }}
      - name: Checkout release candidate
        shell: bash
        run: |
          git fetch origin "factory/${GITHUB_RUN_ID}/candidate:refs/remotes/origin/factory/${GITHUB_RUN_ID}/candidate"
          git switch -C release "origin/factory/${GITHUB_RUN_ID}/candidate"
      - name: Re-run Forge parity gate
        run: bash .github/scripts/forge-parity-check.sh
      - name: Forge registration, deploy and install when configured
        shell: bash
        run: |
          if [[ -z "$FORGE_EMAIL" || -z "$FORGE_API_TOKEN" ]]; then
            echo 'FORGE_LIVE_GATE=SKIPPED_MISSING_FORGE_CREDENTIALS'
            if [[ "$(jq -r '.release_status' state/factory_direction.json)" == 'PARITY_READY_AWAITING_CREDENTIALS' ]]; then
              tmp=$(mktemp)
              jq '.continue=false | .reason="Forge-parity candidate accepted; waiting for live Atlassian credentials." | .next_focus="Connect Forge/Atlassian credentials and run the live gate."' state/factory_direction.json > "$tmp"
              mv "$tmp" state/factory_direction.json
            fi
            exit 0
          fi

          npm install -g @forge/cli@latest
          forge settings set usage-analytics false || true
          forge whoami

          if grep -Eq 'ari:cloud:ecosystem::app/0{8}-0{4}-0{4}-0{4}-0{12}|ATLAS_PLACEHOLDER' manifest.yml; then
            if [[ -z "$FORGE_DEVELOPER_SPACE_ID" ]]; then
              echo '::error::Forge app is unregistered and FORGE_DEVELOPER_SPACE_ID is missing.'
              exit 1
            fi
            forge register --developer-space-id "$FORGE_DEVELOPER_SPACE_ID" --accept-terms 'Cut My Atlassian Bill'
          fi

          forge lint
          forge deploy -e development --non-interactive

          if [[ -n "$ATLASSIAN_SITE" ]]; then
            forge install --site "$ATLASSIAN_SITE" --product Jira -e development --upgrade all --confirm-scopes --non-interactive
          else
            echo 'FORGE_INSTALL=SKIPPED_MISSING_ATLASSIAN_SITE'
          fi
      - name: Optional live Organizations API smoke test
        shell: bash
        run: |
          if [[ -z "$ATLASSIAN_ORG_ID" || -z "$ATLASSIAN_ORG_API_KEY" ]]; then
            echo 'ORG_API_SMOKE=SKIPPED_MISSING_ORG_CREDENTIALS'
            exit 0
          fi
          code=$(curl -sS -o /tmp/org-users.json -w '%{http_code}' \
            -H "Authorization: Bearer $ATLASSIAN_ORG_API_KEY" \
            -H 'Accept: application/json' \
            "https://api.atlassian.com/admin/v1/orgs/$ATLASSIAN_ORG_ID/users")
          test "$code" = '200' || { echo "::error::Organizations API smoke failed HTTP $code"; cat /tmp/org-users.json; exit 1; }
          node -e "const x=require('/tmp/org-users.json'); if(!Array.isArray(x.data)) process.exit(1); console.log('ORG_API_USERS='+x.data.length)"
      - name: Commit release state and registration changes
        shell: bash
        run: |
          git config user.name atlas-forge-release
          git config user.email atlas-forge-release@autonomous.local
          git add manifest.yml docs/RELEASE_STATUS.md state/factory_direction.json 2>/dev/null || true
          git commit -m "Forge gate ${GITHUB_RUN_ID}" || true
      - name: Promote candidate to main
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
