name: Atlas Ox and Runner Watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Atlas 24h Product Factory"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: atlas-factory-orchestrator
  cancel-in-progress: false

jobs:
  recover_transient_failures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover failed Atlas infrastructure paths
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          WF='atlas-factory.yml'

          active_factory_count() {
            gh run list --repo "$REPO" --workflow "$WF" --limit 30 --json status \
              --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0
          }

          dispatch_if_idle() {
            local active_now
            active_now=$(active_factory_count)
            if [[ "$active_now" -gt 0 ]]; then
              echo 'ATLAS_WATCHDOG=DISPATCH_SKIPPED_FACTORY_APPEARED'
              return 0
            fi
            gh workflow run "$WF" --repo "$REPO" --ref main || true
          }

          STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${REPO}/contents/state/factory_direction.json?ref=main" 2>/dev/null || true)
          STATUS=$(jq -r '.release_status // "UNKNOWN"' <<<"${STATE:-{}}" 2>/dev/null || echo UNKNOWN)
          if [[ "$STATUS" == 'MARKETPLACE_READY' ]]; then
            echo 'ATLAS_WATCHDOG=PRODUCT_FINISHED_MARKETPLACE_READY'
            exit 0
          fi

          ACTIVE=$(active_factory_count)
          if [[ "$ACTIVE" -gt 0 ]]; then
            echo 'ATLAS_WATCHDOG=ACTIVE_FACTORY_PRESENT'
            exit 0
          fi

          LATEST=$(gh run list --repo "$REPO" --workflow "$WF" --limit 30 --json databaseId,status,conclusion,createdAt,attempt --jq '[.[]|select(.status=="completed")]|sort_by(.createdAt)|last//empty' 2>/dev/null || true)
          if [[ -z "$LATEST" ]]; then
            echo 'ATLAS_WATCHDOG=BACKUP_BOOTSTRAP_NO_FACTORY_HISTORY'
            dispatch_if_idle
            exit 0
          fi

          ID=$(jq -r '.databaseId' <<<"$LATEST")
          CONCLUSION=$(jq -r '.conclusion // ""' <<<"$LATEST")
          ATTEMPT=$(jq -r '.attempt // 1' <<<"$LATEST")
          CREATED=$(jq -r '.createdAt // empty' <<<"$LATEST")
          now=$(date -u +%s)
          then=$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)
          age=$(( now - then ))

          # Backup continuity path: the dedicated supervisor should normally
          # dispatch immediately after success. If no new factory exists ten
          # minutes later, watchdog independently restarts unfinished Atlas.
          if [[ "$CONCLUSION" == success ]]; then
            if [[ "$age" -ge 600 ]]; then
              echo "ATLAS_WATCHDOG=BACKUP_CONTINUITY_DISPATCH stale_success_run=$ID age=${age}s"
              dispatch_if_idle
            else
              echo "ATLAS_WATCHDOG=WAITING_FOR_PRIMARY_SUPERVISOR run=$ID age=${age}s"
            fi
            exit 0
          fi

          case "$CONCLUSION" in failure|timed_out|cancelled) ;; *)
            if [[ "$age" -ge 600 ]]; then
              echo "ATLAS_WATCHDOG=BACKUP_CONTINUITY_DISPATCH unknown_conclusion=$CONCLUSION run=$ID"
              dispatch_if_idle
            fi
            exit 0
            ;;
          esac

          # Retry a single GitHub run at most three attempts. This is only a
          # local retry budget: exhaustion immediately becomes a fresh cycle.
          if [[ "$ATTEMPT" -ge 3 ]]; then
            echo "ATLAS_WATCHDOG=LOCAL_ATTEMPTS_EXHAUSTED run=$ID attempt=$ATTEMPT; dispatching fresh cycle."
            dispatch_if_idle
            exit 0
          fi

          if [[ "$CONCLUSION" == 'timed_out' ]]; then
            echo "::warning::Run $ID timed out; rerunning failed jobs (attempt $ATTEMPT/3)."
            gh run rerun "$ID" --repo "$REPO" --failed || gh run rerun "$ID" --repo "$REPO" || true
            exit 0
          fi

          set +e
          LOGS=$(gh run view "$ID" --repo "$REPO" --log 2>&1)
          RC=$?
          set -e
          if [[ "$RC" -ne 0 ]]; then
            echo '::warning::Unable to inspect failed-run logs. Dispatching a fresh cycle so log retrieval cannot stop Atlas.'
            dispatch_if_idle
            exit 0
          fi

          TRANSIENT_RE='(ATLAS_TRANSIENT_OX_DETECTED|ATLAS_TRANSIENT_OX_EXHAUSTED|ATLAS_TRANSIENT_OX_INSTALL_EXHAUSTED|network_error|NetworkError|network error|fetch failed|APIConnectionError|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|timed out|socket hang up|HTTP[^0-9]*(429|500|502|503|504)|rate.?limit|service unavailable|bad gateway|gateway timeout|temporar(y|ily) unavailable|upstream request failed|endpoint is unavailable|unexpected server error|internal server error|provider[^\n]*(unavailable|overloaded|capacity)|server[^\n]*overloaded|try again later|UnknownError|err_[A-Za-z0-9]+|curl: \([0-9]+\)|could not resolve host|failed to connect|runner has received a shutdown signal|runner service is stopped|lost communication with the runner)'

          if grep -Eiq "$TRANSIENT_RE" <<<"$LOGS"; then
            echo "::warning::Transient Ox/provider/network/runner signature found in run $ID; rerunning failed jobs (attempt $ATTEMPT/3)."
            gh run rerun "$ID" --repo "$REPO" --failed || gh run rerun "$ID" --repo "$REPO" || true
            exit 0
          fi

          if grep -Fq 'ATLAS_BUILD_ARTIFACT_MISSING' <<<"$LOGS"; then
            echo "::warning::Builder returned no product artifacts in run $ID; rerunning failed builder path (attempt $ATTEMPT/3)."
            gh run rerun "$ID" --repo "$REPO" --failed || true
            exit 0
          fi

          # Deterministic failure is not replayed blindly, but it is also not
          # terminal: a fresh multi-agent cycle gets the current main + latest
          # integration checkpoint and is responsible for repairing it.
          echo "ATLAS_WATCHDOG=DETERMINISTIC_FAILURE run=$ID; dispatching fresh repair cycle."
          dispatch_if_idle
